<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique des matchs</title>
<link rel="stylesheet" href="../commun/theme.css?v=rem5">
<link rel="stylesheet" href="historique.css?v=19">
<link rel="stylesheet" href="../commun/entete.css?v=rem21">
<link rel="stylesheet" href="../commun/tri.css?v=6">
<link rel="stylesheet" href="../commun/cartes.css?v=3">
<script src="/commun/fond.js?v=6"></script>
<script src="/commun/compte.js?v=5" defer></script>
</head>
<body>
<a href="../index.html" class="lien-accueil">Accueil</a>
<h1 class="titre-page">Historique des matchs</h1>

  <!-- Recherche, tris (sens inversé par un 2e clic) et filtre "mes matchs". -->
  <div class="barre-historique">
    <input type="text" id="recherche" class="recherche-historique" placeholder="Rechercher un joueur, un boss, un perso…">
    <div class="tris">
      <span class="tris-label">Trier :</span>
      <button type="button" class="bouton-historique tri-historique" data-tri="date">Date <span class="fleche"></span></button>
      <button type="button" class="bouton-historique tri-historique" data-tri="temps" title="Meilleur temps du match">Temps <span class="fleche"></span></button>
      <button type="button" class="bouton-historique tri-historique" data-tri="ecart" title="Écart de temps entre les 2 joueurs">Écart <span class="fleche"></span></button>
      <button type="button" class="bouton-historique tri-historique" data-tri="boss" title="Boss (A → Z)">Boss <span class="fleche"></span></button>
    </div>
    <button type="button" id="mes-matchs" class="bouton-historique cache" title="N'afficher que mes matchs">Mes matchs</button>
    <button type="button" id="matchs-classes" class="bouton-historique" title="N'afficher que les matchs classés">Classés 🏆</button>
    <button type="button" id="clear-historique" class="btn-clear-filtres" title="Réinitialiser les filtres"><img src="../DB/images/others/remove_filters.webp" alt="Réinitialiser les filtres"></button>
  </div>

  <!-- Rooms en cours : à regarder en spectateur. -->
  <section id="section-en-cours" class="section-matchs cache">
    <h2 class="titre-section">Matchs en cours</h2>
    <div id="liste-en-cours" class="liste-matchs"></div>
  </section>

  <!-- Administrateurs : matchs invalidés par un litige (temps à corriger
       puis republier) et joueurs ayant le plus de litiges. -->
  <section id="section-litiges" class="section-matchs section-litiges cache">
    <h2 class="titre-section">Litiges <span class="badge-admin">Admin</span></h2>
    <h3 class="sous-titre-section">Joueurs en litige</h3>
    <p id="etat-stats-litiges" class="etat-historique"></p>
    <div class="table-litiges-cadre">
      <table id="table-litiges" class="table-litiges">
        <thead>
          <tr>
            <th>Joueur</th>
            <th><button type="button" class="tri-litiges" data-tri="total" title="Litiges ouverts et corrigés">Total <span class="fleche"></span></button></th>
            <th><button type="button" class="tri-litiges" data-tri="ouverts" title="Litiges pas encore traités">Ouverts <span class="fleche"></span></button></th>
            <th><button type="button" class="tri-litiges" data-tri="republies" title="Temps corrigés et match republié">Corrigés <span class="fleche"></span></button></th>
            <th><button type="button" class="tri-litiges" data-tri="signales" title="Litiges signalés par ce joueur">Signalés <span class="fleche"></span></button></th>
            <th><button type="button" class="tri-litiges" data-tri="subis" title="Litiges signalés par son adversaire">Subis <span class="fleche"></span></button></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <h3 class="sous-titre-section">Matchs invalidés <span id="filtre-litiges" class="filtre-litiges cache"></span></h3>
    <p id="etat-litiges" class="etat-historique"></p>
    <div id="liste-litiges" class="liste-matchs"></div>
  </section>

  <section class="section-matchs">
    <h2 class="titre-section">Matchs terminés</h2>
    <p id="etat-historique" class="etat-historique">Chargement…</p>
    <div id="liste-matchs" class="liste-matchs"></div>
  </section>

  <script src="/commun/variantes.js?v=3"></script>
  <script src="/commun/cartes.js?v=8"></script>
  <script src="/commun/tri.js?v=14"></script>
  <script src="historique.js?v=17"></script>
</body>
</html>
