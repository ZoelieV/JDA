<h1 class="titre-page">Créer un match</h1>

  <div class="choix-match">
    <div class="option-match panneau">
      <button id="creer-prive" type="button" class="btn-principal">Match privé</button>
      <p>Tu reçois un lien à envoyer à ton adversaire : la première personne qui l'ouvre joue contre toi.
        Les autres peuvent regarder depuis l'historique.</p>
    </div>
    <div class="option-match panneau">
      <button id="lancer-matchmaking" type="button" class="btn-principal">Matchmaking</button>
      <p>Tu es mis automatiquement face au prochain joueur qui clique aussi sur Matchmaking.</p>
    </div>
  </div>
