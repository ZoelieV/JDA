<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match</title>
<link rel="stylesheet" href="match.css?v=rem42">
<link rel="stylesheet" href="../commun/entete.css?v=rem21">
<link rel="stylesheet" href="../commun/tri.css?v=6">
<link rel="stylesheet" href="../commun/cartes.css?v=3">
</head>
<body>
<!-- Accueil à gauche, partage du lien de la room à droite. -->
<div class="barre-room">
  <a href="../index.html" class="lien-accueil">Accueil</a>
  <button id="btn-partager" type="button" class="btn-partager" title="Copier le lien de la room pour l'envoyer à ton adversaire">Partager le lien</button>
</div>
<h1 class="titre-page">Match</h1>
<!-- Théâtre de la draft (nombre de bans), dès que les 2 joueurs sont là. -->
<p id="mode-theatre-room" class="mode-theatre-room cache"></p>
<!-- Draft classée : chronos (analyse, bans d'équilibrage, pendule des
     picks / bans), pause "Mon adversaire a crash", notifications. -->
<div id="chronos" class="chronos cache"></div>
<div id="zone-crash" class="zone-crash cache">
  <button id="btn-crash" type="button" class="btn-crash" title="Met la draft en pause jusqu'au retour de ton adversaire (10 minutes maximum)">Mon adversaire a crash</button>
</div>
<div id="bandeau-pause" class="bandeau-pause cache" role="status"></div>
<div id="notif-match" class="notif-match cache" role="status"></div>

  <!-- Attente de l'adversaire. Match privé : lien à partager ; matchmaking :
       recherche automatique, annulable (cf. suivreMatchmaking dans match.js). -->
  <div id="etat-attente">
    <span id="texte-attente">En attente du second joueur…</span>
    <button id="btn-annuler-matchmaking" type="button" class="btn-annuler-matchmaking cache">Annuler</button>
  </div>

  <!-- Joueurs seulement : nombre de spectateurs du match (bas à gauche, en
       haut à gauche sur téléphone, visible dès 1 spectateur). -->
  <div id="indicateur-spectateurs" class="indicateur-spectateurs cache" aria-live="polite"></div>

  <div id="zone-match" class="cache">

    <div class="entetes-joueurs">
      <div class="entete-joueur" id="entete-joueur1"></div>
      <!-- Centre des entêtes pendant la draft et la saisie du temps (cf.
           rendrePhase()) : boss tiré. -->
      <div id="entete-centre" class="entete-centre cache">
        <div id="boss-affiche" class="bandeau-boss"></div>
      </div>
      <div class="entete-joueur" id="entete-joueur2"></div>
    </div>

    <!-- Bulles de texte (consignes, action à réaliser, états) : figées en
         bas au centre de l'écran, sur tous les formats. Chaque bulle n'est
         visible que pendant sa phase (cf. BULLES_PAR_PHASE dans match.js). -->
    <div id="bulles-bas" class="bulles-bas">
      <div id="message-choix-box" class="bandeau-info"></div>
      <!-- Bans d'équilibrage : même bouton que "Confirmer" de la draft (rouge). -->
      <button id="btn-confirmer-bonus" type="button" class="btn-confirmer-action action-ban cache" disabled>Confirmer les bans</button>
      <div id="message-equilibrage" class="bandeau-info"></div>
      <!-- Room complète : les suivants regardent en spectateur. -->
      <div id="etat-spectateur" class="bandeau-info etat-spectateur cache">👁 Tu regardes ce match en spectateur.</div>
      <!-- Draft : valide le personnage sélectionné dans la grille. -->
      <button id="btn-confirmer-action" type="button" class="btn-confirmer-action cache" disabled>Confirmer</button>
      <div id="tour-actuel" class="bandeau-info tour-actuel"></div>
      <div id="etat-temps" class="bandeau-info"></div>
      <div id="etat-rejouer" class="bandeau-info cache"></div>
    </div>

    <!-- Barre recherche / tri / filtres, commune à toutes les phases avec
         des persos (choix de box, analyse, bans d'équilibrage, draft). -->
    <div class="draft-toolbar cache" id="barre-outils">
      <div id="zone-recherche" class="zone-recherche"></div>
      <div class="toolbar-droite">
        <div class="filtres-tri" id="filtres-tri"></div>
      </div>
    </div>

    <!-- Phases 1 et 2 : choix de box (box adverse cachée) puis analyse (les
         2 box visibles, box verrouillées). Colonnes fixes j1 (gauche) / j2
         (droite), alignées sur les entêtes joueurs ci-dessus : chacun ne
         peut modifier que sa propre colonne. -->
    <!-- Match annulé : un des joueurs a démarré un autre match. -->
    <section id="phase-annule" class="phase cache">
      <div class="match-annule">
        <p class="ligne-vainqueur"><span class="litige">Match annulé</span></p>
        <p id="texte-annule"></p>
        <a href="matchmaking.html" class="lien-creer-match">Créer un match</a>
      </div>
    </section>

    <section id="phase-choix-box" class="phase cache">
      <div class="colonnes-box">
        <div class="colonne-box" id="colonne-box-j1">
          <h3 id="titre-box-j1">Box</h3>
          <!-- Boutons de box et bouton prêt sur la même ligne (prêt côté
               centre : à droite pour j1, à gauche pour j2). -->
          <div class="ligne-box">
            <div class="box-select" id="box-select-j1"></div>
            <button id="btn-pret-j1" type="button" class="cache">Je suis prêt</button>
          </div>
          <div class="statut-pret" id="statut-pret-j1"></div>
          <div class="apercu-box grille-pool" id="apercu-box-j1"></div>
        </div>
        <div class="colonne-box" id="colonne-box-j2">
          <h3 id="titre-box-j2">Box</h3>
          <!-- Boutons de box et bouton prêt sur la même ligne (prêt côté
               centre : à droite pour j1, à gauche pour j2). -->
          <div class="ligne-box">
            <div class="box-select" id="box-select-j2"></div>
            <button id="btn-pret-j2" type="button" class="cache">Je suis prêt</button>
          </div>
          <div class="statut-pret" id="statut-pret-j2"></div>
          <div class="apercu-box grille-pool" id="apercu-box-j2"></div>
        </div>
      </div>
    </section>

    <!-- Phase 2 : bans bonus d'équilibrage. Les bans choisis vont dans des
         emplacements dédiés (bans-bonus-slots) qu'on peut modifier/annuler
         avant de confirmer. -->
    <section id="phase-bans-bonus" class="phase cache">
      <div class="bans-bonus-layout">
        <div class="bans-bonus-slots" id="bans-bonus-slots"></div>
      </div>

      <div id="grille-bans-bonus" class="grille-pool"></div>
    </section>

    <!-- Phases 3 à 5 : draft, saisie du temps (puis vérification), résultat. Mêmes tableaux
         des joueurs à gauche / droite (namecard, picks, bans, puis bans
         d'équilibrage) ; au centre, la grille des persos pendant la draft,
         puis le résultat, le boss et Rejouer. -->
    <section id="phase-draft" class="phase cache">
      <div class="draft-layout">
        <div class="colonne-joueur" id="colonne-j1">
          <!-- Fin de match : temps (saisie, attente, résultat) au-dessus du
               tableau. -->
          <div class="recap-temps cache" id="recap-temps-j1"></div>
          <div class="equipe-joueur" id="equipe-j1">
            <!-- Namecard (photo, pseudo, temps en fin de match) + trait de
                 la couleur du joueur. -->
            <div class="entete-tableau" id="entete-tableau-j1"></div>
            <h4 class="titre-zone" id="titre-picks-j1">Picks</h4>
            <div class="slots-pick" id="slots-pick-j1"></div>
            <h4 class="titre-zone">Bans</h4>
            <div class="slots-ban" id="rangee-bans-j1"></div>
          </div>
          <div class="bans-equilibrage cache" id="bans-eq-j1">
            <h4>Bans d'équilibrage</h4>
            <div class="bans-eq-grille" id="bans-eq-grille-j1"></div>
          </div>
        </div>

        <div class="grille-pool" id="grille-pool-draft"></div>

        <div class="recap-centre cache" id="recap-centre">
          <div id="resultat-final" class="resultat-final cache"></div>
          <!-- Vérification des temps : chaque joueur confirme les 2 temps
               saisis, ou signale un litige (manche invalidée). -->
          <div id="verification-temps" class="verification-temps cache">
            <p class="titre-verification">Vérifie les deux temps</p>
            <div class="boutons-verification">
              <button id="btn-confirmer-temps" type="button">Les temps sont corrects</button>
              <button id="btn-litige" type="button">Litige</button>
            </div>
          </div>
          <div id="recap-boss" class="bandeau-boss"></div>
          <button id="btn-rejouer" type="button" class="cache">Rejouer</button>
        </div>

        <div class="colonne-joueur" id="colonne-j2">
          <!-- Fin de match : temps (saisie, attente, résultat) au-dessus du
               tableau. -->
          <div class="recap-temps cache" id="recap-temps-j2"></div>
          <div class="equipe-joueur" id="equipe-j2">
            <!-- Namecard (photo, pseudo, temps en fin de match) + trait de
                 la couleur du joueur. -->
            <div class="entete-tableau" id="entete-tableau-j2"></div>
            <h4 class="titre-zone" id="titre-picks-j2">Picks</h4>
            <div class="slots-pick" id="slots-pick-j2"></div>
            <h4 class="titre-zone">Bans</h4>
            <div class="slots-ban" id="rangee-bans-j2"></div>
          </div>
          <div class="bans-equilibrage cache" id="bans-eq-j2">
            <h4>Bans d'équilibrage</h4>
            <div class="bans-eq-grille" id="bans-eq-grille-j2"></div>
          </div>
        </div>
      </div>

      <!-- Saisie du temps : déplacée au-dessus du tableau du joueur
           connecté (cf. rendreTempsJoueur). -->
      <div id="saisie-temps" class="saisie-temps cache">
        <label for="input-temps">Ton temps</label>
        <div class="ligne-saisie-temps">
          <input id="input-temps" type="text" placeholder="Ton temps" inputmode="decimal">
          <button id="btn-valider-temps" type="button" class="btn-valider-temps">Valider</button>
        </div>
        <!-- Abandon à la place d'un temps (2 abandons : égalité ; un abandon
             et un temps : le temps gagne). -->
        <button id="btn-abandon" type="button" class="btn-abandon">Abandonner</button>
      </div>
    </section>

  </div>

  <script src="/commun/variantes.js?v=3"></script>
  <script src="/commun/cartes.js?v=9"></script>
  <script src="/commun/tri.js?v=14"></script>
  <script src="match.js?v=58"></script>
</body>
</html>
