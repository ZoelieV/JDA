<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match</title>
<link rel="stylesheet" href="match.css">
</head>
<body>
<a href="../index.html" class="lien-accueil">Accueil</a>
<h1>Match</h1>

  <div id="etat-attente">En attente du second joueur…</div>

  <div id="controles">
    <div id="view-selector">
      <button type="button" class="view-btn active" data-view="characters">Personnages</button>
      <button type="button" class="view-btn" data-view="weapons">Armes</button>
    </div>

    <div id="box-selector">
      <button type="button" class="box-btn active" data-box="full">Full box</button>
      <button type="button" class="box-btn" data-box="stuff">Stuff</button>
    </div>
  </div>

  <div id="joueurs">
    <section class="colonne-joueur" id="colonne-joueur1">
      <div class="entete-joueur" id="entete-joueur1"></div>
      <div class="box-joueur" id="box-joueur1"></div>
    </section>

    <section class="colonne-joueur" id="colonne-joueur2">
      <div class="entete-joueur" id="entete-joueur2"></div>
      <div class="box-joueur" id="box-joueur2"></div>
    </section>
  </div>

  <script src="match.js"></script>
</body>
</html>
