<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match</title>
<link rel="stylesheet" href="match.css">
</head>
<body>
<a href="../index.html" class="lien-accueil">Accueil</a>
<h1>Match</h1>

  <div id="etat-attente">En attente du second joueur…</div>

  <div id="zone-match" class="cache">

    <div class="entetes-joueurs">
      <div class="entete-joueur" id="entete-joueur1"></div>
      <div class="entete-joueur" id="entete-joueur2"></div>
    </div>

    <!-- Phase 1 : choix de box + prêt -->
    <section id="phase-choix-box" class="phase cache">
      <div class="colonnes-box">
        <div class="colonne-box">
          <h3>Ta box</h3>
          <div class="box-select" id="box-select-moi"></div>
          <div class="statut-pret" id="statut-pret-moi"></div>
          <button id="btn-pret" type="button">Je suis prêt</button>
          <div class="apercu-box" id="apercu-box-moi"></div>
        </div>
        <div class="colonne-box colonne-box-adversaire">
          <h3>Box adverse</h3>
          <div class="box-select desactive" id="box-select-adversaire"></div>
          <div class="statut-pret" id="statut-pret-adversaire"></div>
          <div class="apercu-box" id="apercu-box-adversaire"></div>
        </div>
      </div>
    </section>

    <!-- Phase 2 : bans bonus d'équilibrage -->
    <section id="phase-bans-bonus" class="phase cache">
      <div id="message-equilibrage" class="bandeau-info"></div>
      <div id="grille-bans-bonus" class="grille-pool"></div>
    </section>

    <!-- Phase 3 : draft (boss + bans/picks) -->
    <section id="phase-draft" class="phase cache">
      <div id="boss-affiche" class="bandeau-boss"></div>
      <div id="tour-actuel" class="bandeau-info"></div>

      <div class="draft-layout">
        <div class="equipe-joueur" id="equipe-j1">
          <div class="slots-pick" id="slots-pick-j1"></div>
          <div class="rangee-bans" id="rangee-bans-j1"></div>
        </div>

        <div class="grille-pool" id="grille-pool-draft"></div>

        <div class="equipe-joueur" id="equipe-j2">
          <div class="slots-pick" id="slots-pick-j2"></div>
          <div class="rangee-bans" id="rangee-bans-j2"></div>
        </div>
      </div>
    </section>

    <!-- Phase 4 : saisie du temps -->
    <section id="phase-temps" class="phase cache">
      <div class="saisie-temps">
        <label for="input-temps">Ton temps de complétion (mm:ss)</label>
        <div class="ligne-saisie-temps">
          <input id="input-temps" type="text" placeholder="7:32" inputmode="numeric">
          <button id="btn-valider-temps" type="button">Valider</button>
        </div>
      </div>
      <div id="etat-temps" class="bandeau-info"></div>
    </section>

    <!-- Phase 5 : résultat -->
    <section id="phase-termine" class="phase cache">
      <div id="resultat-final"></div>
      <button id="btn-rejouer" type="button">Rejouer</button>
    </section>

  </div>

  <script src="match.js"></script>
</body>
</html>
