<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match</title>
<link rel="stylesheet" href="match.css">
</head>
<body>
<a href="../index.html" class="lien-accueil">Accueil</a>
<h1>Match</h1>

  <div id="etat-attente">En attente du second joueur…</div>

  <div id="zone-match" class="cache">

    <div class="entetes-joueurs">
      <div class="entete-joueur" id="entete-joueur1"></div>
      <!-- Centre des entêtes pendant la draft et la saisie du temps (cf.
           rendrePhase()) : boss tiré. -->
      <div id="entete-centre" class="entete-centre cache">
        <div id="boss-affiche" class="bandeau-boss"></div>
      </div>
      <div class="entete-joueur" id="entete-joueur2"></div>
    </div>

    <!-- Action à réaliser pendant la draft : figée en bas au centre de
         l'écran (cf. .tour-actuel). -->
    <div id="tour-actuel" class="tour-actuel cache"></div>

    <!-- Barre recherche / tri / filtres, commune à toutes les phases avec
         des persos (choix de box, analyse, bans d'équilibrage, draft). -->
    <div class="draft-toolbar cache" id="barre-outils">
      <div id="zone-recherche" class="zone-recherche"></div>
      <div class="toolbar-droite">
        <div id="bans-bonus-recap" class="bans-bonus-recap cache"></div>
        <div class="filtres-tri" id="filtres-tri"></div>
      </div>
    </div>

    <!-- Phases 1 et 2 : choix de box (box adverse cachée) puis analyse (les
         2 box visibles, box verrouillées). Colonnes fixes j1 (gauche) / j2
         (droite), alignées sur les entêtes joueurs ci-dessus : chacun ne
         peut modifier que sa propre colonne. -->
    <section id="phase-choix-box" class="phase cache">
      <div id="message-choix-box" class="bandeau-info"></div>
      <div class="colonnes-box">
        <div class="colonne-box" id="colonne-box-j1">
          <h3 id="titre-box-j1">Box</h3>
          <div class="box-select" id="box-select-j1"></div>
          <div class="statut-pret" id="statut-pret-j1"></div>
          <button id="btn-pret-j1" type="button" class="cache">Je suis prêt</button>
          <div class="apercu-box grille-pool" id="apercu-box-j1"></div>
        </div>
        <div class="colonne-box" id="colonne-box-j2">
          <h3 id="titre-box-j2">Box</h3>
          <div class="box-select" id="box-select-j2"></div>
          <div class="statut-pret" id="statut-pret-j2"></div>
          <button id="btn-pret-j2" type="button" class="cache">Je suis prêt</button>
          <div class="apercu-box grille-pool" id="apercu-box-j2"></div>
        </div>
      </div>
    </section>

    <!-- Phase 2 : bans bonus d'équilibrage. Les bans choisis vont dans des
         emplacements dédiés (bans-bonus-slots) qu'on peut modifier/annuler
         avant de confirmer. -->
    <section id="phase-bans-bonus" class="phase cache">
      <div id="message-equilibrage" class="bandeau-info"></div>

      <div class="bans-bonus-layout">
        <div class="bans-bonus-slots" id="bans-bonus-slots"></div>
        <button id="btn-confirmer-bonus" type="button" class="cache">Confirmer les bans</button>
      </div>

      <div id="grille-bans-bonus" class="grille-pool"></div>
    </section>

    <!-- Phase 3 : draft (boss + bans/picks) -->
    <section id="phase-draft" class="phase cache">
      <div class="draft-layout">
        <div class="equipe-joueur" id="equipe-j1">
          <div class="slots-pick" id="slots-pick-j1"></div>
          <div class="slots-ban" id="rangee-bans-j1"></div>
        </div>

        <div class="grille-pool" id="grille-pool-draft"></div>

        <div class="equipe-joueur" id="equipe-j2">
          <div class="slots-pick" id="slots-pick-j2"></div>
          <div class="slots-ban" id="rangee-bans-j2"></div>
        </div>
      </div>
    </section>

    <!-- Phase 4 : saisie du temps -->
    <section id="phase-temps" class="phase cache">
      <div class="recap-teams">
        <div class="equipe-joueur" id="recap-equipe-j1"></div>
        <div class="equipe-joueur" id="recap-equipe-j2"></div>
      </div>

      <div class="saisie-temps">
        <label for="input-temps">Ton temps de complétion (mm:ss)</label>
        <div class="ligne-saisie-temps">
          <input id="input-temps" type="text" placeholder="7:32">
          <button id="btn-valider-temps" type="button">Valider</button>
        </div>
      </div>
      <div id="etat-temps" class="bandeau-info"></div>
    </section>

    <!-- Phase 5 : résultat -->
    <section id="phase-termine" class="phase cache">
      <div id="resultat-final"></div>
      <button id="btn-rejouer" type="button">Rejouer</button>
      <div id="etat-rejouer" class="bandeau-info cache"></div>
    </section>

  </div>

  <script src="match.js"></script>
</body>
</html>
