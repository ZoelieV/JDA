<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Classement</title>
  <link rel="icon" type="image/webp" href="/DB/images/others/logo_site.webp">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/DB/images/others/appli_apple_180.png">
  <meta name="theme-color" content="#1e1e1e">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/commun/theme.css?v=rem5">
  <link rel="stylesheet" href="/commun/entete.css?v=rem40">
  <link rel="stylesheet" href="/commun/tri.css?v=7">
  <link rel="stylesheet" href="/classement/classement.css?v=13">
  <link rel="stylesheet" href="/commun/site.css?v=10">
<script src="/commun/fond.js?v=16"></script>
<script src="/commun/appli.js?v=1" defer></script>
<script src="/commun/zoom.js?v=3"></script>
<script src="/commun/compte.js?v=47" defer></script>
</head>
<body>
  <a href="/" class="lien-accueil">Accueil</a>
  <h1 class="titre-page">Classement</h1>

  <!-- Saison affichée : en cours (par défaut) ou une saison passée
       (classement final, trophées gardés à la fin de la saison). -->
  <div class="choix-saison">
    <select id="saison-classement" class="select-saison" title="Saison affichée" aria-label="Saison affichée"></select>
  </div>

  <!-- Recherche ; tris par l'en-tête du tableau (cf. initialiserTris). -->
  <div class="barre-classement">
    <input type="text" id="recherche-classement" class="recherche-classement" placeholder="Rechercher un joueur…">
  </div>

  <!-- Ordi : rang, bannière du joueur puis ses stats en colonnes ;
       téléphone : rang et bannière (valeur du tri en cours dessus). -->
  <div class="tableau-classement">
    <!-- En-tête : un clic trie par la colonne (2e clic : sens inversé) ;
         # = trophées, Joueur = ordre alphabétique. -->
    <div class="ligne-classement entete-classement">
      <span class="col-rang tri-entete" data-tri="trophees" title="Trier par rang (trophées)">#</span>
      <span class="col-joueur tri-entete" data-tri="alpha" title="Trier par pseudo">Joueur <span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="trophees" data-tri="trophees" title="Trier par : Trophées"><img class="tri-logo" src="/DB/images/others/Achievement_Wonders_of_the_World.webp" alt=""><span class="fleche"></span></span>
      <span class="col-stat col-texte tri-entete" data-col="record" data-tri="record" title="Trier par : Record de trophées de la saison">Record<span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="matchs_classes" data-tri="matchs_classes" title="Trier par : Matchs classés joués">⚔️<span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="ratio" data-tri="ratio" title="Trier par : Winrate en classé">%<span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="points" data-tri="points" title="Trier par : Points (Full box)"><img class="tri-logo" src="/DB/images/others/scale.webp" alt=""><span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="nb_persos" data-tri="nb_persos" title="Trier par : Nombre de personnages"><img class="tri-logo" src="/DB/images/others/Icon_Party_Setup.webp" alt=""><span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="nb_c6" data-tri="nb_c6" title="Trier par : C6 5★">🐋<span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="constellations_5" data-tri="constellations_5" title="Trier par : Constellations 5★ limités"><img class="tri-logo" src="/DB/images/others/Item_Genesis_Crystal.webp" alt=""><span class="fleche"></span></span>
      <span class="col-stat tri-entete" data-col="theatre" data-tri="theatre" title="Trier par : Théâtre"><img class="tri-logo tri-logo-palier" src="/DB/images/others/theatre_carpe.webp?v=3" alt=""><span class="fleche"></span></span>
    </div>
    <p id="etat-classement" class="etat-classement">Chargement…</p>
    <div id="liste-classement"></div>
  </div>

  <script src="/commun/synergies.js?v=1"></script>
  <script src="/commun/cartes.js?v=32"></script>
  <script src="/classement/classement.js?v=13"></script>
  <script src="/commun/site.js?v=10"></script>
</body>
</html>
