<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joueurs</title>
<link rel="icon" type="image/webp" href="/DB/images/others/logo_site.webp">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/DB/images/others/appli_apple_180.png">
<meta name="theme-color" content="#1e1e1e">
<link rel="stylesheet" href="/all_accounts/all_accounts.css?v=rem34">
<link rel="stylesheet" href="/commun/entete.css?v=rem41">
<link rel="stylesheet" href="/commun/tri.css?v=7">
<link rel="stylesheet" href="/commun/cartes.css?v=4">
  <link rel="stylesheet" href="/commun/site.css?v=10">
<script src="/commun/fond.js?v=16"></script>
<script src="/commun/appli.js?v=1" defer></script>
<script src="/commun/zoom.js?v=3"></script>
<script src="/commun/compte.js?v=52" defer></script>
</head>
<body>
<a href="/" class="lien-accueil">Accueil</a>
<h1 class="titre-page">Joueurs</h1>

  <!-- Box des joueurs, ou leurs flex cosmétiques (?onglet=flex). -->
  <div class="onglets-comptes" role="tablist">
    <button type="button" class="onglet-comptes active" role="tab" aria-selected="true" data-onglet="box">Box<span>collections des joueurs</span></button>
    <button type="button" class="onglet-comptes" role="tab" aria-selected="false" data-onglet="flex">Flex cosmétiques<span>12 cosmétiques choisis par chaque joueur</span></button>
  </div>

  <div data-panneau="box">
  <!-- Recherche et tris de la liste des comptes (sens inversé par un 2e clic). -->
  <div class="barre-comptes">
    <input type="text" id="recherche-comptes" class="recherche-personnage" placeholder="Rechercher un joueur…">
    <div class="tris">
      <span class="tris-label">Trier :</span>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="activite" title="Activité récente"><img class="tri-logo" src="/DB/images/others/Icon_Clock.webp" alt="Activité"> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="alpha">A → Z <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="points" title="Trier par points"><img class="tri-logo" src="/DB/images/others/scale.webp" alt="Points"> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="nb_persos" title="Nombre de personnages"><img class="tri-logo" src="/DB/images/others/Icon_Party_Setup.webp" alt="Nombre de personnages"> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="nb_c6" title="C6 5★"><span class="tri-emoji" aria-label="C6 5★">🐋</span> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="constellations_5" title="Somme des constellations des 5★ limités (sans les persos standards)"><img class="tri-logo" src="/DB/images/others/Item_Genesis_Crystal.webp" alt="Constellations 5★"> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="theatre" title="Théâtre : palier et cost de la full box"><img class="tri-logo tri-logo-palier" src="/DB/images/others/theatre_carpe.webp?v=3" alt="Théâtre"> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="matchs" title="Matchs joués"><span class="tri-emoji" aria-label="Matchs">⚔️</span> <span class="fleche"></span></button>
      <button type="button" class="filtre-etoile-btn tri-compte-btn" data-tri="ratio" title="Winrate"><img class="tri-logo" src="/DB/images/others/Achievement_Wonders_of_the_World.webp" alt="Winrate"> <span class="fleche"></span></button>
    </div>
    <button type="button" id="clear-comptes" class="btn-clear-filtres" title="Réinitialiser les filtres"><img src="/DB/images/others/remove_filters.webp" alt="Réinitialiser les filtres"></button>
  </div>

  <div id="accounts-list"></div>
  </div>

  <!-- Flex cosmétiques : recherche, tris (valeur en Rikoyns, A → Z,
       cosmétiques exclusifs), une carte par joueur avec sa grille 3 × 4. -->
  <div data-panneau="flex" hidden>
    <div class="barre-comptes">
      <input type="text" id="recherche-flex" class="recherche-personnage" placeholder="Rechercher un joueur…">
      <div class="tris">
        <span class="tris-label">Trier :</span>
        <button type="button" class="filtre-etoile-btn tri-flex-btn" data-tri="valeur" title="Valeur des cosmétiques flex, en Rikoyns"><img class="tri-logo" src="/DB/images/others/rikoyn.webp" alt="Rikoyns"> <span class="fleche"></span></button>
        <button type="button" class="filtre-etoile-btn tri-flex-btn" data-tri="alpha">A → Z <span class="fleche"></span></button>
        <button type="button" class="filtre-etoile-btn tri-flex-btn" data-tri="exclusifs" title="Cosmétiques exclusifs (pas en vente : exclusifs, cachés, focus du tirage)">✨ Exclusifs <span class="fleche"></span></button>
      </div>
      <button type="button" id="clear-flex" class="btn-clear-filtres" title="Réinitialiser"><img src="/DB/images/others/remove_filters.webp" alt="Réinitialiser"></button>
    </div>
    <div id="liste-flex"></div>
  </div>

  <div id="modal">
    <div id="modal-content">
      <div id="modal-header">
        <h2 id="modal-title">Profil</h2>
        <button id="close-modal" type="button">×</button>
      </div>

      <!-- Vue (personnages/armes) et box (full/stuff) sur une seule ligne,
           boutons de taille identique. -->
      <div id="selecteurs">
        <div id="view-selector">
          <button type="button" class="view-btn active" data-view="characters">Personnages</button>
          <button type="button" class="view-btn" data-view="weapons">Armes</button>
        </div>
        <div id="box-selector">
          <!-- Points de chaque box (persos + armes, comme dans Mon compte). -->
          <button type="button" class="box-btn active" data-box="full">Full box<span class="points-box"></span></button>
          <button type="button" class="box-btn" data-box="stuff">Stuff<span class="points-box"></span></button>
        </div>
      </div>

      <!-- Recherche / tri / filtres, comme en draft (sans le filtre J1/J2). -->
      <div id="barre-outils" class="barre-outils">
        <div class="zone-recherche">
          <input type="text" id="recherche" class="recherche-personnage" placeholder="Rechercher…">
          <div class="tris">
            <span class="tris-label">Trier :</span>
            <button type="button" class="filtre-etoile-btn tri-btn" data-tri="points"><img class="tri-logo" src="/DB/images/others/scale.webp" alt="Points"></button>
            <button type="button" class="filtre-etoile-btn tri-btn" data-tri="constellation"><img class="tri-logo tri-logo-constellation" src="/DB/images/others/stella_fortuna_5.webp" alt="Constellation"></button>
            <button type="button" class="filtre-etoile-btn tri-btn" data-tri="niveau"><img class="tri-logo tri-logo-niveau" src="/DB/images/others/stella.webp" alt="Niveau"></button>
            <button type="button" class="filtre-etoile-btn tri-btn" data-tri="rarete" title="Trier par rareté"><span class="tri-etoile">★</span></button>
            <button type="button" class="filtre-etoile-btn tri-btn" data-tri="element"><img class="tri-logo" src="/DB/images/others/omni_element.webp" alt="Élément"></button>
            <button type="button" class="filtre-etoile-btn tri-btn" data-tri="arme"><img class="tri-logo" src="/DB/images/others/Icon_Inventory_Weapons.webp" alt="Type d'arme"></button>
          </div>
        </div>
        <div class="filtres-tri">
          <div id="filtres-icones" class="filtres-icones"></div>
          <!-- Personnages : filtre par type d'arme. -->
          <div id="filtres-armes-persos" class="filtres-icones"></div>
          <div class="filtres-etoiles">
            <button type="button" class="filtre-etoile-btn" data-etoile="5">5★</button>
            <button type="button" class="filtre-etoile-btn" data-etoile="4">4★</button>
            <button type="button" class="filtre-etoile-btn" data-etoile="3">3★</button>
          </div>
          <div id="filtres-voeux" class="filtres-icones filtre-voeu">
            <button type="button" class="filtre-icone-btn" data-voeu="intertwined" title="Personnages limités"><img src="/DB/images/others/Item_Intertwined_Fate.webp" alt="Intertwined Fate"></button>
            <button type="button" class="filtre-icone-btn" data-voeu="acquaint" title="Personnages Standards"><img src="/DB/images/others/Item_Acquaint_Fate.webp" alt="Acquaint Fate"></button>
          </div>
          <!-- Factions (personnages) : FACTIONS de commun/tri.js. -->
          <div id="filtres-factions" class="filtres-icones filtre-voeu">
            <button type="button" class="filtre-icone-btn" data-faction="lunar" title="Lunaire"><img src="/DB/images/others/lunar.webp" alt="Lunaire"></button>
            <button type="button" class="filtre-icone-btn" data-faction="hexerei" title="Hexerei"><img src="/DB/images/others/hexerei.webp" alt="Hexerei"></button>
            <button type="button" class="filtre-icone-btn" data-faction="stellar" title="Stellaire"><img src="/DB/images/others/stellar.webp" alt="Stellaire"></button>
          </div>
          <!-- Rôles (cumulables, groupés dans l'ordre des clics). -->
          <div id="filtres-soutiens" class="filtres-icones filtre-voeu">
            <button type="button" class="filtre-icone-btn" data-soutien="shield" title="Bouclier"><img src="/DB/images/others/shield.webp" alt="Bouclier"></button>
            <button type="button" class="filtre-icone-btn" data-soutien="heal" title="Soin"><img src="/DB/images/others/heal.webp" alt="Soin"></button>
          </div>
          <!-- Favoris (son propre profil) : filtre activé / désactivé. -->
          <div class="filtres-icones">
            <button type="button" class="filtre-icone-btn tri-btn filtre-favoris" data-tri="favoris" title="N'afficher que les favoris"><img class="tri-logo" src="/DB/images/others/favourite.webp" alt="Favoris"></button>
          </div>
          <button type="button" id="btn-clear-filtres" class="btn-clear-filtres" title="Réinitialiser les filtres"><img src="/DB/images/others/remove_filters.webp" alt="Réinitialiser les filtres"></button>
        </div>
      </div>

      <div id="profile-box" class="grille-pool"></div>
    </div>
  </div>

  <script src="/commun/variantes.js?v=4"></script>
  <script src="/commun/synergies.js?v=2"></script>
  <script src="/commun/cartes.js?v=33"></script>
  <script src="/commun/tri.js?v=21"></script>
  <script src="/all_accounts/all_accounts.js?v=42"></script>
  <script src="/commun/site.js?v=13"></script>
</body>
</html>
